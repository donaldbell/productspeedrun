; Backpack Defender Rev B firmware (ESP32-C3-WROOM-02-N4). See NOTES.md.
;   pio run                       build for the real board (default env)
;   pio run -e devkit             build for a plain ESP32-C3-DevKitM-1 stand-in
;   pio run -t upload             flash over native USB (Tag-Connect TC2030 on J2)
;   pio device monitor            logs + serial test commands (type h)
; include/pins.h is regenerated from ../5-electronics/src/design.py before every build.

[platformio]
default_envs = backpack-defender

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
extra_scripts = pre:scripts/pio_pins.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; The real Rev B board: true deep sleep, wakes on PIR (IO0) / button (IO1).
; Logs over native USB (IO18/IO19 on the TC2030 pads), since UART0's pins drive the RGB LED.
[env:backpack-defender]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; A bare ESP32-C3-DevKitM-1 (or similar) on the bench:
;  - its WS2812 is on GPIO8, not IO20
;  - its BOOT button (GPIO9) stands in for the big button
;  - deep sleep is simulated (so USB serial stays up): type p / b to fake the PIR / button
;  - internal pulls on PIR / button, since the dev board has none
;  - logs on UART0 (IO20/IO21) through the board's USB-UART bridge, so RGB_PWR_N moves to the unused IO1
;    (a native-USB C3 board: add -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1)
[env:devkit]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPIN_RGB_DATA=8
    -DPIN_RGB_PWR_N=1
    -DPIN_BTN=9
    -DBD_SIM_SLEEP=1
    -DBD_INTERNAL_PULLS=1
    -DBD_FAKE_VBAT_MV=2900
