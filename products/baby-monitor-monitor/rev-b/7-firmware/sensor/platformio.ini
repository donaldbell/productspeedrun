; Baby Monitor Monitor Rev B: SENSOR firmware (ESP32-C6-MINI-1-N4, ESP-IDF). See ../NOTES.md.
;   pio run                   build for the real sensor board (default env)
;   pio run -e devkit         build for a plain ESP32-C6-DevKitC-1 on the bench (no mic: scripted sounds)
;   pio run -t upload         flash over the sensor's USB-C (native USB, no buttons needed)
;   pio device monitor        logs
; include/pins.h is regenerated from ../../5-electronics/sensor/src/design.py before every build.
;
; ESP-IDF, not Arduino: this platform's Arduino core (2.0.17) has no ESP32-C6 support; its ESP-IDF is 5.5.

[platformio]
default_envs = sensor

[env]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:../common/scripts/pio_pre.py
build_flags = -Wall

; The real Rev B sensor board.
[env:sensor]

; An ESP32-C6-DevKitC-1 on the bench:
;  - its WS2812 (GPIO8) stands in for the bar light, its BOOT button (GPIO9) for the snooze bar
;  - no microphone: BMM_FAKE_AUDIO plays a scripted night (quiet / fussing / crying / screaming, looping).
;    To use a real ICS-43434 or INMP441 breakout instead, wire SCK IO4, WS IO5, SD IO2 (L/R to GND)
;    and delete the -DBMM_FAKE_AUDIO line.
;  - battery faked at 3.9 V (IO0 floats on a devkit)
[env:devkit]
build_flags =
    ${env.build_flags}
    -DPIN_BAR_IO=8
    -DPIN_BTN=9
    -DBMM_FAKE_AUDIO=1
    -DBMM_FAKE_VBAT_MV=3900
