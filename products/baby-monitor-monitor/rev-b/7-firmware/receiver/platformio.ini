; Baby Monitor Monitor Rev B: WATCH (receiver) firmware (ESP32-C6-MINI-1-N4, ESP-IDF). See ../NOTES.md.
;   pio run                   build for the real watch board (default env)
;   pio run -e devkit         build for a plain ESP32-C6-DevKitC-1 on the bench
;   pio run -t upload         flash on the pogo jig before the lens goes on (USB D+/D- on TP2/TP3, IO9 low on TP1)
;   pio device monitor        logs (USB Serial/JTAG on the jig)
; include/pins.h is regenerated from ../../5-electronics/receiver/src/design.py before every build.
;
; ESP-IDF, not Arduino: this platform's Arduino core (2.0.17) has no ESP32-C6 support; its ESP-IDF is 5.5.

[platformio]
default_envs = receiver

[env]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:../common/scripts/pio_pre.py
build_flags = -Wall

; The real Rev B watch board.
[env:receiver]

; An ESP32-C6-DevKitC-1 on the bench:
;  - its WS2812 (GPIO8) stands in for the face glow
;  - motor PWM stays on IO2: wire a small N-MOSFET + coin motor (or an LED + 1k) to see the patterns
;  - battery faked at 3.9 V (IO0 floats on a devkit); CHG_STAT (IO1) floats high = not charging
;  - it accepts pairing for 2 minutes after reset: reset it, then hold the sensor's bar 3 s
[env:devkit]
build_flags =
    ${env.build_flags}
    -DPIN_LED_IO=8
    -DBMM_FAKE_VBAT_MV=3900
